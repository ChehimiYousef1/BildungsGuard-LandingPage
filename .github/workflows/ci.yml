name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins — never resolves
      # a newer version behind your back, which is the point of a CI install.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      # Fails the build if a dependency has a known high-severity advisory.
      - name: Audit dependencies
        run: npm audit --audit-level=high
